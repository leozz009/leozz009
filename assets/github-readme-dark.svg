  <text x="90" y="1114" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Designed a relational SwiftData model with Transaction and Category entities for scalable financial tracking.</text>
  <circle cx="79" cy="1130" r="2.5" fill="#444441"/>
  <text x="90" y="1134" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Integrated Apple's Speech framework and Foundation Models to generate and categorize transactions.</text>
  <circle cx="79" cy="1150" r="2.5" fill="#444441"/>
  <text x="90" y="1154" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Built interactive financial analytics with Swift Charts and receipt management via VisionKit.</text>
  <circle cx="79" cy="1170" r="2.5" fill="#444441"/>
  <text x="90" y="1174" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Enabled fast transaction entry using App Intents, Siri, and Shortcuts.</text>

