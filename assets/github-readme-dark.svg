  <text x="184" y="880" font-family="'DM Sans', sans-serif" fill="#444441" font-size="12">— Air Quality Monitoring App</text>
  
  <circle cx="79" cy="906" r="2.5" fill="#444441"/>
  <text x="90" y="910" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Designed and developed an iOS app for ITESM enabling real-time air quality monitoring across Nuevo León.</text>
  <circle cx="79" cy="926" r="2.5" fill="#444441"/>
  <text x="90" y="930" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Integrated data from university and community sensors, measuring PM10, PM2.5, humidity, and temperature.</text>
  <circle cx="79" cy="946" r="2.5" fill="#444441"/>
  <text x="90" y="950" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Applied Clean Architecture with MVVM, separating Data, Domain, and Presentation layers for scalability.</text>
  <circle cx="79" cy="966" r="2.5" fill="#444441"/>
  <text x="90" y="970" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Implemented an interactive MapKit map showing real-time sensor locations.</text>
  <circle cx="79" cy="986" r="2.5" fill="#444441"/>
  <text x="90" y="990" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Built Swift Charts visualizations to analyze historical pollutant trends.</text>

