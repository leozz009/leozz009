  <text x="116" y="696" font-family="'DM Sans', sans-serif" fill="#444441" font-size="12">— Eye Health Monitoring App</text>
  <rect x="690" y="679" width="122" height="20" rx="10" fill="#FAC775"/>
  <text x="751" y="693" font-family="'JetBrains Mono', monospace" fill="#412402" font-size="8.5" letter-spacing="0.5" text-anchor="middle" font-weight="700">🏆 WWDC 2025</text>


  <circle cx="79" cy="722" r="2.5" fill="#444441"/>
  <text x="90" y="726" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Released a production iOS app focused on eye health, offering personalized insights and visual tracking.</text>
  <circle cx="79" cy="742" r="2.5" fill="#444441"/>
  <text x="90" y="746" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Built structured SwiftData models to manage eye exams and prescription history with persistent storage.</text>
  <circle cx="79" cy="762" r="2.5" fill="#444441"/>
  <text x="90" y="766" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Integrated Foundation Models to generate context-aware educational content and personalized vision insights.</text>
  <circle cx="79" cy="782" r="2.5" fill="#444441"/>
  <text x="90" y="786" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Implemented Swift Charts for interactive visualizations of vision changes over time.</text>
  <circle cx="79" cy="802" r="2.5" fill="#444441"/>
  <text x="90" y="806" font-family="'DM Sans', sans-serif" fill="#888780" font-size="11.5">Used TipKit to enhance onboarding and feature discovery through contextual guidance.</text>

